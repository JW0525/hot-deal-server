# 1시간마다 다섯 커뮤니티를 수집해서 결과를 GitHub Pages(`data` 브랜치)에 올린다.
# 미니앱은 그 주소에서 딜 목록과 썸네일을 바로 받아간다. 상시 켜두는 서버가 없다.
#
# 왜 서버가 아니라 여기서 도는가:
#   · 크롤링은 CPU를 많이 쓴다. Cloudflare 무료 Worker는 요청당 10ms까지만 허용해 불가능하다.
#   · Render 같은 무료 서버는 계정당 1개 제한 + 15분이면 잠든다.
#   · GitHub Actions는 공개 저장소에서 무료·무제한이고, 이런 주기 작업이 원래 용도다.
name: crawl

on:
  schedule:
    # 정각은 전 세계 작업이 몰려 밀리기 쉬워서 7분에 돌린다.
    - cron: "7 * * * *"
  workflow_dispatch: # 저장소 Actions 탭에서 손으로 즉시 실행할 수 있게

# data 브랜치에 push해야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

# 앞 실행이 늦어져 겹치면 커뮤니티 서버를 두 배로 때리게 되므로 하나씩만 돈다.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 지난 회차 결과 가져오기
        run: |
          # 지난 딜 목록(7일치 히스토리)과 이미 받아둔 썸네일을 그대로 이어 쓴다.
          # 없으면(첫 실행) 빈 폴더로 시작한다.
          if git clone --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" site 2>/dev/null; then
            rm -rf site/.git
            echo "이전 썸네일 $(ls site/thumbs 2>/dev/null | wc -l)장을 이어서 씁니다."
          else
            mkdir -p site
            echo "이전 결과가 없습니다 — 처음부터 시작합니다."
          fi
          node scripts/site.js import site

      - name: 크롤링
        run: npm run crawl

      - name: 딜 목록 + 썸네일 만들기
        run: node scripts/site.js build site

      - name: GitHub Pages에 올리기
        run: |
          # 기록을 쌓지 않고 매번 통째로 덮어쓴다. 1시간마다 커밋이 쌓이면
          # 저장소가 계속 불어나는데, 지난 시각의 딜 목록은 쓸 데가 없다.
          cd site
          git init -q -b data
          git config user.name "hotdeal-bot"
          git config user.email "hotdeal-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "딜 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "게시 완료: https://jw0525.github.io/hotdeal-server/deals.json"
