<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>핫딜헌터 : 흩어진 핫딜, 한 곳에서</title>
<meta name="description" content="뽐뿌·퀘이사존·클리앙·어미새·루리웹 핫딜을 한 곳에 모아 검색하고 비교하세요.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    --bg: #fffaf0;
    --card-bg: #ffffff;
    --text: #1c1a15;
    --text-sub: #7a7266;
    --text-faint: #b3aa9a;
    --border: #f0e6d2;
    --accent: #ff5a3c;
    --accent-2: #ff8a3d;
    --accent-soft: #ffece5;
    --tan: #fbeed0;
    --tan-text: #8a6d2f;
    --gold-1: #f8cf52;
    --gold-2: #f3b93a;
    --gold-text: #8a5a12;
    --pink: #fbdfe3;
    --pink-text: #c8465c;
    --뽐뿌: #ff6b6b;
    --퀘이사존: #4d96ff;
    --클리앙: #22b573;
    --어미새: #a06bff;
    --루리웹: #ff9f1c;
    --shadow-sm: 0 1px 2px rgba(28,26,21,0.05);
    --shadow-md: 0 10px 28px rgba(28,26,21,0.10);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* ---------- header ---------- */
  header {
    background: rgba(255, 250, 240, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-inner {
    max-width: 1240px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .logo {
    font-size: 20px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; color: var(--accent);
    background: none; border: none; cursor: pointer; font-family: inherit; padding: 4px 0;
  }

  .cat-nav {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 120px;
  }
  .cat-nav::-webkit-scrollbar { display: none; }
  .cat-pill {
    flex-shrink: 0; padding: 8px 15px; border-radius: 999px; border: none; background: var(--tan);
    color: var(--tan-text); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .cat-pill:hover { filter: brightness(0.96); }
  .cat-pill.active { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(255,90,60,0.3); }

  .search-box {
    flex: 1 1 220px; min-width: 180px; max-width: 340px; display: flex; align-items: center;
    background: var(--tan); border-radius: 999px; padding: 9px 16px; transition: box-shadow 0.2s;
  }
  .search-box:focus-within { box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-box input { border: none; background: transparent; outline: none; flex: 1; font-size: 13.5px; color: var(--text); font-family: inherit; }
  .search-box input::placeholder { color: var(--tan-text); opacity: 0.7; }
  .search-box svg { flex-shrink: 0; margin-right: 8px; opacity: 0.55; color: var(--tan-text); }

  .rank-link {
    background: none; border: none; font-size: 13px; font-weight: 600; color: var(--text-sub);
    cursor: pointer; white-space: nowrap; padding: 8px 4px; font-family: inherit;
  }
  .rank-link:hover { color: var(--accent); }

  .search-btn {
    border: none; background: var(--accent); color: #fff; border-radius: 999px;
    padding: 10px 20px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
    white-space: nowrap; transition: all 0.15s; box-shadow: 0 4px 12px rgba(255,90,60,0.3);
  }
  .search-btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
  .search-btn:active { transform: translateY(0); }

  /* ---------- hero ---------- */
  .hero-wrap { max-width: 1240px; margin: 20px auto 0; padding: 0 24px; }
  .hero {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    border-radius: 28px; padding: 40px 44px; display: flex; align-items: center; gap: 32px;
    justify-content: space-between; flex-wrap: wrap;
  }
  .hero-text { max-width: 520px; }
  .hero-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: var(--gold-text); margin-bottom: 10px; }
  .hero-title { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; color: #1c1a15; line-height: 1.25; margin-bottom: 22px; }
  .hero-cta {
    display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    padding: 13px 26px; border-radius: 999px; font-size: 14px; font-weight: 700;
    box-shadow: 0 8px 20px rgba(255,90,60,0.35); transition: transform 0.15s;
    border: none; cursor: pointer; font-family: inherit;
  }
  .hero-cta:hover { transform: translateY(-2px); }
  .hero-panel {
    flex: 0 0 280px; height: 180px; border: 2px dashed rgba(28,26,21,0.18); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: rgba(255,255,255,0.18);
  }
  .hero-panel-icon { font-size: 34px; }
  .hero-panel-stat { font-size: 22px; font-weight: 800; color: #1c1a15; }
  .hero-panel-label { font-size: 12.5px; font-weight: 600; color: var(--gold-text); text-align: center; }

  /* ---------- section ---------- */
  main { max-width: 1240px; margin: 0 auto; padding: 36px 24px 24px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .section-head h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .section-sub { font-size: 12.5px; color: var(--text-faint); font-weight: 500; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 7px 15px; border-radius: 999px; border: 1px solid var(--border); background: var(--card-bg);
    font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-sub);
    transition: all 0.15s; white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active {
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent; font-weight: 700; box-shadow: 0 4px 12px rgba(255,90,60,0.28);
  }

  select#sortSelect {
    margin-left: auto; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card-bg); font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer;
    box-shadow: var(--shadow-sm);
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }

  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
    transition: box-shadow 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-4px); border-color: transparent; }
  .card:hover .thumb img { transform: scale(1.06); }
  .card a.card-link { text-decoration: none; color: inherit; display: flex; flex-direction: column; height: 100%; }

  .thumb {
    height: 148px; background: linear-gradient(135deg, #f5efe0, #ece2c9);
    display: flex; align-items: center; justify-content: center; font-size: 36px; position: relative; overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }

  .body-text { padding: 13px 15px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }

  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge-source { font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: #fff; }
  .badge-end { font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--pink); color: var(--pink-text); }
  .src-뽐뿌 { background: var(--뽐뿌); }
  .src-퀘이사존 { background: var(--퀘이사존); }
  .src-클리앙 { background: var(--클리앙); }
  .src-어미새 { background: var(--어미새); }
  .src-루리웹 { background: var(--루리웹); }

  .category-tag { font-size: 11px; font-weight: 600; color: var(--text-faint); }
  .title {
    font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 38px;
  }
  .price-row { display: flex; align-items: baseline; gap: 6px; }
  .price { font-size: 19px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
  .price.unknown { font-size: 13px; font-weight: 600; color: var(--text-faint); }

  .meta-row { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; margin-top: 2px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-faint); font-weight: 500; }

  .empty { text-align: center; padding: 80px 20px; color: var(--text-sub); }
  .empty .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty .empty-text { font-size: 14px; }

  .skeleton-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .skeleton-thumb { height: 148px; background: linear-gradient(90deg, #f5efe0 25%, #ece2c9 37%, #f5efe0 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  .skeleton-line { height: 12px; margin: 14px 15px; border-radius: 6px; background: linear-gradient(90deg, #f5efe0 25%, #ece2c9 37%, #f5efe0 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  .skeleton-line.short { width: 55%; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  footer { text-align: center; padding: 36px 20px; color: var(--text-faint); font-size: 12px; border-top: 1px solid var(--border); margin-top: 20px; }

  @media (max-width: 700px) {
    .logo { font-size: 17px; }
    .hero { padding: 28px 24px; }
    .hero-title { font-size: 24px; }
    .hero-panel { flex-basis: 100%; height: 120px; }
    select#sortSelect { margin-left: 0; width: 100%; order: 99; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <button class="logo" id="logoBtn" title="처음으로">핫딜헌터</button>
    <nav class="cat-nav" id="categoryFilter"></nav>
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="상품명, 쇼핑몰 검색 후 엔터">
    </div>
    <button class="rank-link" id="popularBtn">인기랭킹</button>
    <button class="search-btn" id="searchBtn">🔍 검색</button>
  </div>
</header>

<div class="hero-wrap">
  <div class="hero">
    <div class="hero-text">
      <div class="hero-eyebrow">HOT DEAL HUNTER</div>
      <h1 class="hero-title">후회 없는 핫딜만 모았다</h1>
      <button class="hero-cta" id="heroCta">오늘의 핫딜 보러가기</button>
    </div>
    <div class="hero-panel">
      <div class="hero-panel-icon">🎯</div>
      <div class="hero-panel-stat" id="heroCount">-</div>
      <div class="hero-panel-label">5개 사이트 실시간 수집중</div>
    </div>
  </div>
</div>

<main id="dealsSection">
  <div class="section-head">
    <h2>지금 뜨는 핫딜</h2>
    <span class="section-sub" id="statsText">불러오는 중...</span>
  </div>

  <div class="controls">
    <div class="filter-group" id="sourceFilter"></div>
    <select id="sortSelect">
      <option value="popular">인기순(추천)</option>
      <option value="latest">최신 수집순</option>
      <option value="priceAsc">가격 낮은순</option>
      <option value="priceDesc">가격 높은순</option>
      <option value="comments">댓글 많은순</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="empty-icon">🔍</div>
    <div class="empty-text" id="emptyText"></div>
  </div>
</main>

<footer>
  핫딜헌터 · 뽐뿌·퀘이사존·클리앙·어미새·루리웹 핫딜 게시판을 1시간마다 자동 수집합니다 · 실제 재고/최저가는 원문에서 확인하세요
</footer>

<script>
const SOURCE_COLORS = { "뽐뿌": "🐷", "퀘이사존": "🌌", "클리앙": "🌿", "어미새": "🐦", "루리웹": "🎮" };

let ALL_DEALS = [];
let state = { source: "전체", category: "전체", sort: "popular", query: "" };

function renderSkeleton(count = 8) {
  const grid = document.getElementById("grid");
  grid.innerHTML = Array.from({ length: count }).map(() => `
    <div class="skeleton-card">
      <div class="skeleton-thumb"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line short"></div>
    </div>
  `).join("");
}

async function loadDeals() {
  document.getElementById("statsText").textContent = "불러오는 중...";
  if (ALL_DEALS.length === 0) renderSkeleton();
  try {
    const res = await fetch("/api/deals");
    const data = await res.json();
    ALL_DEALS = data.deals || [];
    document.getElementById("heroCount").textContent = ALL_DEALS.length.toLocaleString("ko-KR");
    buildFilters();
    render();
  } catch (err) {
    document.getElementById("statsText").textContent = "딜을 불러오지 못했어요. 서버가 켜져 있는지 확인해주세요.";
    console.error(err);
  }
}

function formatPrice(deal) {
  if (deal.price == null) return { text: "가격 정보 없음", unknown: true };
  if (deal.priceCurrency === "USD") return { text: "$" + deal.price.toLocaleString("en-US"), unknown: false };
  return { text: deal.price.toLocaleString("ko-KR") + "원", unknown: false };
}

function buildFilters() {
  const sources = ["전체", ...new Set(ALL_DEALS.map((d) => d.source))];
  // 카테고리 노출 순서를 고정한다. "이벤트/포인트"는 "기타" 바로 앞에 오도록,
  // 목록에 없는(알 수 없는) 카테고리는 이벤트/포인트와 같은 자리(기타 바로 앞)에 둔다.
  const CATEGORY_ORDER = ["전자기기", "가전/생활", "식품", "패션/뷰티", "게임/취미", "여행/기타", "이벤트/포인트", "기타"];
  const categoryRank = (c) => {
    const idx = CATEGORY_ORDER.indexOf(c);
    return idx === -1 ? CATEGORY_ORDER.length - 1 : idx;
  };
  const rawCategories = [...new Set(ALL_DEALS.map((d) => d.category).filter(Boolean))];
  rawCategories.sort((a, b) => categoryRank(a) - categoryRank(b));
  const categories = ["전체", ...rawCategories];

  const sf = document.getElementById("sourceFilter");
  sf.innerHTML = sources.map((s) =>
    `<button class="chip ${state.source === s ? "active" : ""}" data-type="source" data-value="${s}">${s === "전체" ? "전체 출처" : (SOURCE_COLORS[s] || "") + " " + s}</button>`
  ).join("");

  const cf = document.getElementById("categoryFilter");
  cf.innerHTML = categories.map((c) =>
    `<button class="cat-pill ${state.category === c ? "active" : ""}" data-type="category" data-value="${c}">${c === "전체" ? "전체" : c}</button>`
  ).join("");

  document.querySelectorAll(".chip, .cat-pill").forEach((btn) => {
    btn.addEventListener("click", () => {
      state[btn.dataset.type] = btn.dataset.value;
      buildFilters();
      render();
    });
  });
}

function getFiltered() {
  let list = ALL_DEALS.filter((d) => {
    if (state.source !== "전체" && d.source !== state.source) return false;
    if (state.category !== "전체" && d.category !== state.category) return false;
    if (state.query && !d.title.toLowerCase().includes(state.query.toLowerCase())) return false;
    return true;
  });

  switch (state.sort) {
    case "popular": list.sort((a, b) => (b.recommend || 0) - (a.recommend || 0)); break;
    case "latest": list.sort((a, b) => new Date(b.crawledAt) - new Date(a.crawledAt)); break;
    case "priceAsc": list.sort((a, b) => (a.price ?? Infinity) - (b.price ?? Infinity)); break;
    case "priceDesc": list.sort((a, b) => (b.price ?? -Infinity) - (a.price ?? -Infinity)); break;
    case "comments": list.sort((a, b) => (b.commentCount || 0) - (a.commentCount || 0)); break;
  }

  // 썸네일이 없는(카트 아이콘만 뜨는) 딜은 정렬 결과와 상관없이 항상 맨 뒤로 보낸다.
  // Array.sort는 안정 정렬이라 위에서 정한 순서는 그룹 안에서 그대로 유지된다.
  list.sort((a, b) => (a.thumbnail ? 0 : 1) - (b.thumbnail ? 0 : 1));

  return list;
}

function render() {
  const list = getFiltered();
  const grid = document.getElementById("grid");
  const empty = document.getElementById("emptyState");
  const emptyText = document.getElementById("emptyText");
  const stats = document.getElementById("statsText");

  stats.textContent = `총 ${ALL_DEALS.length}개 딜 중 ${list.length}개 표시`;

  if (list.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    emptyText.textContent = ALL_DEALS.length === 0
      ? "아직 수집된 딜이 없어요. 서버가 첫 크롤링을 마칠 때까지 잠시 기다려주세요."
      : "검색 결과가 없어요. 다른 키워드로 찾아보세요.";
    return;
  }
  empty.style.display = "none";

  grid.innerHTML = list.map((d) => {
    const price = formatPrice(d);
    return `
    <div class="card">
      <a class="card-link" href="${d.url}" target="_blank" rel="noopener noreferrer">
        <div class="thumb">
          ${d.thumbnail ? `<img src="/api/thumb?url=${encodeURIComponent(d.thumbnail)}" loading="lazy" onerror="this.outerHTML='🛒'">` : "🛒"}
        </div>
        <div class="body-text">
          <div class="badge-row">
            <span class="badge-source src-${d.source}">${d.source}</span>
            ${d.ended ? '<span class="badge-end">종료된 핫딜입니다</span>' : ""}
          </div>
          <div class="category-tag">${d.category || "기타"}</div>
          <div class="title">${d.title}</div>
          <div class="price-row">
            <span class="price ${price.unknown ? "unknown" : ""}">${price.text}</span>
          </div>
          <div class="meta-row">
            <span>추천 ${d.recommend || 0} · 댓글 ${d.commentCount || 0}</span>
            <span>${d.postedLabel || ""}</span>
          </div>
        </div>
      </a>
    </div>
  `;
  }).join("");
}

document.getElementById("sortSelect").addEventListener("change", (e) => {
  state.sort = e.target.value;
  render();
});

// 검색은 실시간 입력 반영이 아니라, 검색 버튼을 누르거나 엔터를 쳤을 때만 반영한다.
function runSearch() {
  state.query = document.getElementById("searchInput").value;
  render();
}
document.getElementById("searchBtn").addEventListener("click", runSearch);
document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") runSearch();
});

document.getElementById("popularBtn").addEventListener("click", () => {
  state.sort = "popular";
  document.getElementById("sortSelect").value = "popular";
  render();
  document.getElementById("dealsSection").scrollIntoView({ behavior: "smooth" });
});

// 핫딜헌터 로고를 누르면 모든 필터/검색/정렬을 초기화하고 처음 화면으로 돌아간다.
document.getElementById("logoBtn").addEventListener("click", () => {
  state = { source: "전체", category: "전체", sort: "popular", query: "" };
  document.getElementById("searchInput").value = "";
  document.getElementById("sortSelect").value = "popular";
  buildFilters();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

// "오늘의 핫딜 보러가기"를 누르면 인기순으로 정렬된 추천 딜 목록으로 이동한다.
document.getElementById("heroCta").addEventListener("click", () => {
  state.sort = "popular";
  document.getElementById("sortSelect").value = "popular";
  render();
  document.getElementById("dealsSection").scrollIntoView({ behavior: "smooth" });
});

loadDeals();
</script>
