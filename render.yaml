# Render 배포 설정 (Blueprint).
#
# Render 대시보드에서 이 저장소를 고르면 아래 설정을 그대로 읽어서 서비스를 만든다.
# 화면에서 값을 하나씩 고를 필요가 없고, 설정이 코드로 남아 다음에도 똑같이 재현된다.
#
# region을 singapore로 두는 이유: Render에 한국 리전이 없다. 선택지(oregon/ohio/
# virginia/frankfurt/singapore) 중 한국에서 가장 가까워 응답이 눈에 띄게 빠르다.
services:
  - name: hotdeal-server-jw
    type: web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    # 서버가 살아있는지 Render가 확인하는 주소. 깨우기 핑도 이 주소를 쓴다.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # 수동 크롤링(/api/crawl-now)을 아무나 호출하지 못하게 막는 열쇠.
      # Render가 무작위로 만들어 주므로 사람이 비밀번호를 만들거나 채팅에 붙여넣을 일이 없다.
      # 값은 Render 대시보드 > Environment 에서 확인한다.
      - key: CRAWL_TOKEN
        generateValue: true
